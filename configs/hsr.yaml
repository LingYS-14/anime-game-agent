tasks:
  - id: enter_game
    name: 从标题进入游戏
    entry: title
    risk: low
    timeout_s: 120
    success: none
    steps:
      - type: wait
        condition: {kind: seconds, seconds: 42}
      - type: click
        target: {anchor: title_enter}
      - type: wait
        condition: {kind: seconds, seconds: 35}
  - id: open_phone
    name: 打开手机菜单（Esc）
    entry: main_ui
    risk: low
    timeout_s: 30
    success: none
    steps:
      - type: key
        keys: [esc]
        action: tap
        hold_ms: 40
  - id: open_map
    name: 打开地图（只读查看）
    entry: main_ui
    risk: low
    timeout_s: 30
    success: none
    steps:
      - type: key
        keys: [m]
        action: tap
        hold_ms: 40

checks:
  in_game:
    anchor: hud_chat
    present: true
    threshold: 0.8
    note: 游戏内 HUD（聊天按钮）可见即视为主界面
  title_screen:
    anchor: title_enter
    present: true
    threshold: 0.8
    note: 标题画面「点击进入」可见
  phone_open:
    anchor: phone_close
    present: true
    threshold: 0.8
    note: 手机主界面右上角关闭 X 可见
  mail_open:
    ocr:
      region: [0.02, 0.02, 0.30, 0.12]
      contains: 短信
      min_confidence: 0.6
      preset: fast
    note: 短信界面左上角标题

skills:
  - id: enter_game
    description: 标题画面点「点击进入」并等待载入（实机约 30 s）
    confirm: [in_game]
    actions:
      - type: wait
        condition: {kind: seconds, seconds: 42}
      - type: click
        target: {anchor: title_enter}
        button: left
        clicks: 1
        hold_ms: 60
      - type: wait
        condition: {kind: seconds, seconds: 35}
  - id: open_phone
    description: 点击右上角最左的手机图标打开手机菜单
    actions:
      - type: click
        target: {anchor: hud_phone}
        button: left
        clicks: 1
        hold_ms: 60
      - type: wait
        condition: {kind: seconds, seconds: 2}
  - id: phone_open
    description: 按 Esc 打开手机主界面（星铁实测 Esc 打开手机）
    require: [in_game]
    confirm: [phone_open]
    actions:
      - type: key
        keys: [esc]
        action: tap
        hold_ms: 40
      - type: wait
        condition: {kind: check, name: phone_open, timeout: 8, interval: 0.25}
  - id: phone_close
    description: 再按一次 Esc 关闭手机主界面
    require: [phone_open]
    confirm: [in_game]
    actions:
      - type: key
        keys: [esc]
        action: tap
        hold_ms: 40
      - type: wait
        condition: {kind: check, name: in_game, timeout: 8, interval: 0.25}
  - id: close_panel
    description: 按 Esc 关闭当前面板
    actions:
      - type: key
        keys: [esc]
        action: tap
        hold_ms: 40
      - type: wait
        condition: {kind: seconds, seconds: 1}
  - id: open_mail
    description: 手机主界面点「短信」打开消息列表（只读，不点领取）
    require: [phone_open]
    confirm: [mail_open]
    actions:
      - type: click
        target: {anchor: phone_mail}
        button: left
        clicks: 1
        hold_ms: 60
      - type: wait
        condition: {kind: check, name: mail_open, timeout: 10, interval: 0.3}
  - id: back_to_phone
    description: 从短信界面返回手机主界面（Esc）
    require: [mail_open]
    confirm: [phone_open]
    actions:
      - type: key
        keys: [esc]
        action: tap
        hold_ms: 40
      - type: wait
        condition: {kind: check, name: phone_open, timeout: 8, interval: 0.25}

safety:
  max_runtime_s: 1800
  max_tasks_per_run: 3
  emergency_stop_key: F12
  dry_run: true
  allowed_tasks: [enter_game, open_phone, open_map]
  disallow_pvp: true
  record: true
  privacy_regions: []
  forbid_keys: [alt+f4, alt+tab, win, ctrl+shift+esc]
  confirm_before: [payment, gacha, delete]
