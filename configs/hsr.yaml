version: 1
id: hsr
name: 崩坏：星穹铁道
game_version: "4.6.0"
region: cn
notes: >-
  2026-11-08 实机校准（2560x1600 全屏，DPI 120%）：直接启动 StarRail.exe 会先到标题画面
  （底部「点击进入」≈ x 0.5 / y 0.94），点击后自动登录并载入派对车厢，无需输入账号密码。
  anchors 的 region 是窗口客户区内的归一化矩形；改分辨率后需要重新截图校准。

window:
  process: StarRail.exe
  title_regex: 崩坏：星穹铁道|Honkai: Star Rail
  class_name: UnityWndClass
  borderless: true
  client_area_only: true
  min_client_size: [1280, 720]
  dpi_aware: true

capture:
  backend: gdi
  fps: 5
  scale: 1.0
  format: png
  color: bgr
  roi: [0.0, 0.0, 1.0, 1.0]

input:
  backend: sendinput
  key_hold_ms: 40
  click_hold_ms: 60
  move_steps: 8
  focus_check: true
  release_on_blur: true
  keymap:
    confirm: enter
    cancel: esc
    map: m

ui:
  theme: dark
  anchors:
    - id: login_enter
      template: null
      region: [0.30, 0.90, 0.70, 0.98]
      threshold: 0.85
      note: 标题画面底部「点击进入」整条，2026-11-08 实机校准（点击 0.5/0.94 可进入）
    - id: phone_icon
      template: null
      region: [0.655, 0.004, 0.705, 0.062]
      threshold: 0.85
      note: 游戏内右上角一排图标里最左侧的手机（菜单）图标，待今夜逐像素复核
  screens: []

tasks:
  - id: login_touch
    name: 进入游戏（只点登录按钮）
    entry: launcher
    risk: low
    timeout_s: 60
    success: window_title_changed
    steps:
      - type: wait
        condition: {kind: stable, stable_ms: 800}
      - type: click
        target: {anchor: login_enter}
  - id: open_map
    name: 打开地图（只读查看）
    entry: main_ui
    risk: low
    timeout_s: 30
    success: none
    steps:
      - type: key
        keys: [m]
        action: tap
        hold_ms: 40

skills:
  - id: login_touch
    description: 点击登录按钮进入游戏（需先按截图校准 login_enter）
    actions:
      - type: wait
        condition: {kind: stable, stable_ms: 800}
      - type: click
        target: {anchor: login_enter}
        button: left
        clicks: 1
        hold_ms: 60

safety:
  max_runtime_s: 1800
  max_tasks_per_run: 3
  emergency_stop_key: F12
  dry_run: true
  allowed_tasks: [login_touch, open_map]
  disallow_pvp: true
  record: true
  privacy_regions: []
  forbid_keys: [alt+f4, alt+tab, win, ctrl+shift+esc]
  confirm_before: [payment, gacha, delete]
