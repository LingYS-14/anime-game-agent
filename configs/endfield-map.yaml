version: 1
id: endfield-map
name: 明日方舟：终末地（地图只读）
game_version: "0.x"
region: cn
notes: >-
  M0 只做窗口定位与截图；地图理解（识别当前区域、路径规划）属于 M2，game_map 现在返回 NOT_IMPLEMENTED。
  anchors 为占位区，需要实机截图后校准。

window:
  process: Endfield.exe
  title_regex: 终末地|Endfield
  class_name: UnityWndClass
  borderless: true
  client_area_only: true
  min_client_size: [1280, 720]
  dpi_aware: true

capture:
  backend: gdi
  fps: 2
  scale: 1.0
  format: png
  color: bgr
  roi: [0.0, 0.0, 1.0, 1.0]

input:
  backend: sendinput
  key_hold_ms: 40
  click_hold_ms: 60
  move_steps: 8
  focus_check: true
  release_on_blur: true
  keymap:
    confirm: enter
    cancel: esc
    map: m

ui:
  theme: dark
  anchors:
    - id: map_open
      template: null
      region: [0.86, 0.86, 0.98, 0.97]
      threshold: 0.85
      note: 打开地图的按钮，M0 占位
    - id: map_center
      template: null
      region: [0.40, 0.40, 0.60, 0.60]
      threshold: 0.85
      note: 地图中心视区，M0 占位
  screens: []

tasks:
  - id: open_map_screen
    name: 打开地图界面（只读）
    entry: main_ui
    risk: low
    timeout_s: 30
    success: none
    steps:
      - type: key
        keys: [m]
        action: tap
        hold_ms: 40

skills: []

safety:
  max_runtime_s: 900
  max_tasks_per_run: 2
  emergency_stop_key: F12
  dry_run: true
  allowed_tasks: [open_map_screen]
  disallow_pvp: true
  record: true
  privacy_regions: []
  forbid_keys: [alt+f4, alt+tab, win, ctrl+shift+esc]
  confirm_before: [payment, gacha, delete]
