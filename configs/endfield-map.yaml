version: 1
id: endfield-map
name: 明日方舟：终末地（地图只读）
game_version: "1.6.3"
region: cn
notes: >-
  M0 只做窗口定位与截图；地图理解（识别当前区域、路径规划）属于 M2，game_map 现在返回 NOT_IMPLEMENTED。
  2026-11-08 实机：直接运行 Endfield.exe 会弹「请通过官方启动器打开游戏」，必须经鹰角启动器
  C:\Hypergryph Launcher\launcher.exe 点「开始游戏」；启动器可执行文件是 Games.exe，窗口标题「鹰角启动器」。
  实机窗口：title=Endfield、class=UnityWndClass、client 2560x1600、dpi 120；进入后自动使用本机保存的账号（UID <redacted-uid>）。
  重要发现：游戏内合成输入（SendInput 的 ESC / W / F / 点击右上图标）均无响应——ACE 反作弊（AntiCheatExpert）
  过滤或忽略注入输入；同一输入方式在星铁可用。按合规底线不尝试绕过 ACE，终末地只走「只读副驾」路线
  （截图 + 识别 + 提示，由人执行），因此本 profile 的 skills/tasks 不用于真实代打。

window:
  process: Endfield.exe
  title_regex: 终末地|Endfield
  class_name: UnityWndClass
  borderless: true
  client_area_only: true
  min_client_size: [1280, 720]
  dpi_aware: true

capture:
  backend: gdi
  fps: 2
  scale: 0.5
  format: png
  color: bgr
  roi: [0.0, 0.0, 1.0, 1.0]

input:
  backend: sendinput
  key_hold_ms: 40
  click_hold_ms: 60
  move_steps: 8
  focus_check: true
  release_on_blur: true
  keymap:
    confirm: enter
    cancel: esc
    map: m

ui:
  theme: dark
  anchors:
    - id: menu_esc
      template: null
      region: [0.950, 0.008, 0.990, 0.064]
      threshold: 0.85
      note: 右上角 ESC 菜单图标，2026-11-08 实机截图测得（但游戏内合成输入被 ACE 过滤，点击无效）
    - id: minimap
      template: null
      region: [0.020, 0.055, 0.120, 0.130]
      threshold: 0.85
      note: 左上小地图/罗盘区域，实机截图测得
    - id: quest_tracker
      template: null
      region: [0.020, 0.200, 0.330, 0.330]
      threshold: 0.85
      note: 左侧任务追踪面板，实机截图测得
    - id: map_center
      template: null
      region: [0.40, 0.40, 0.60, 0.60]
      threshold: 0.85
      note: 地图中心视区，M2 用，占位
  screens: []

tasks:
  - id: open_map_screen
    name: 打开地图界面（只读）
    entry: main_ui
    risk: low
    timeout_s: 30
    success: none
    steps:
      - type: key
        keys: [m]
        action: tap
        hold_ms: 40

skills: []

checks:
  in_game:
    anchor: minimap
    present: true
    threshold: 0.8
    note: 终末地 HUD 小地图可见（只读副驾；ACE 会丢弃合成输入）

safety:
  max_runtime_s: 900
  max_tasks_per_run: 2
  emergency_stop_key: F12
  dry_run: true
  allowed_tasks: [open_map_screen]
  disallow_pvp: true
  record: true
  privacy_regions: []
  forbid_keys: [alt+f4, alt+tab, win, ctrl+shift+esc]
  confirm_before: [payment, gacha, delete]
