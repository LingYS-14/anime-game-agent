[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kiseki-runtime"
version = "0.1.0"
description = "Local MCP tool surface that lets an agent read and drive a game window on Windows"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "KISEKI contributors" }]
keywords = ["mcp", "game-automation", "dsh", "agent"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows",
  "License :: OSI Approved :: MIT License",
]

[project.scripts]
kiseki-runtime = "kiseki_runtime.mcp_server:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
