[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kiseki-runtime"
version = "0.1.0"
description = "Local MCP tool surface that lets an agent read and drive a game window on Windows"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "KISEKI contributors" }]
keywords = ["mcp", "game-automation", "dsh", "agent"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows",
  "License :: OSI Approved :: MIT License",
]

[project.scripts]
kiseki-runtime = "kiseki_runtime.mcp_server:main"

[project.optional-dependencies]
# M1.0+ template matching and later OCR preprocessing.
vision = ["opencv-python-headless>=4.10"]
# M1.1: PaddleOCR reads stylised CJK text on busy game backgrounds.
ocr = ["paddlepaddle>=3.0", "paddleocr>=3.0"]
tools = ["Pillow>=10.0"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
